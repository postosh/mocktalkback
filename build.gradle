plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mocktalkback'
version = '0.1.0'
description = 'mocktalkback'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

def nativeAccessJvmArgs = ['--enable-native-access=ALL-UNNAMED']

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// 모니터링, 메트릭
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// 이미지 최적화 (WebP ImageIO — gotson 후속, JAR 내 네이티브 번들)
	implementation 'net.coobird:thumbnailator:0.4.21'
	runtimeOnly 'com.github.usefulness:webp-imageio:0.10.2'

	// 오브젝트 스토리지
	implementation 'io.minio:minio:8.5.17'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'  // swagger (Boot 4)

	// QueryDSL (OpenFeign fork)
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
	implementation 'io.github.openfeign.querydsl:querydsl-core:7.1'  // core 빼도되지만 버전 강제

	// MapStruct
	implementation "org.mapstruct:mapstruct:1.6.3"
	annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"

	implementation 'org.bouncycastle:bcprov-jdk18on:1.83'  // argon2
	implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260102.1'  // owasp sanitizer
	implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'  // markdown 렌더링
	implementation 'org.yaml:snakeyaml:2.4'  // yaml frontmatter / manifest 파싱
	implementation 'org.apache.poi:poi-ooxml:5.4.1'  // XLSX 임포트 파싱

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
	// implementation 'org.flywaydb:flyway-mysql'
	// runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	developmentOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1'  // P6Spy (dev 전용 SQL 로그 포맷, Boot 4)
	compileOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1'  // P6Spy compile-only

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'  // devtools
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'  // Lombok + MapStruct binding (Lombok 사용 시 권장)

	// QueryDSL APT (Boot 3 = jakarta)
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta'  // QueryDSL Q-class
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'    // (선택) IDE/빌드에서 AP 경고 나면 명시
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'  // (선택) IDE/빌드에서 AP 경고 나면 명시

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jackson-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q-class generated sources, Q클래스 중복생성되므로 주석처리
// def querydslDir = "$buildDir/generated/querydsl"
// sourceSets {
// 	main {
// 		java {
// 			srcDir querydslDir
// 		}
// 	}
// }
// tasks.withType(JavaCompile).configureEach {
// 	options.generatedSourceOutputDirectory = file(querydslDir)
// }

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('bootRun') {
	jvmArgs nativeAccessJvmArgs
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs nativeAccessJvmArgs
}
